name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --dev --frozen --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g pnpm@11.21.0
      - run: pnpm install --frozen-lockfile
        working-directory: src/palinsesto/web/frontend
      - uses: extractions/setup-just@v2
      - run: just gate
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: palinsesto_integration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d palinsesto_integration_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:synthetic-ci-password@127.0.0.1:5432/palinsesto_integration_test
      PALINSESTO_TEST_DATABASE_URL: postgresql+asyncpg://postgres:synthetic-ci-password@127.0.0.1:5432/palinsesto_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.12
      - run: uv sync --dev --frozen --python 3.12
      - uses: extractions/setup-just@v2
      - run: uv run alembic upgrade head
      - run: just test-integration
