services:
  postgres:
    image: postgres:16
    # Ordinary SQL errors can contain financial row details. The application
    # reports safe error codes; do not retain database payloads in diagnostics.
    command:
      - postgres
      - -c
      - log_min_messages=fatal
      - -c
      - log_min_error_statement=panic
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_duration=off
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    environment:
      POSTGRES_DB: palinsesto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d palinsesto"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
