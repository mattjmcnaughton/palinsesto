<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crate &amp; Counter: week 47</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Courier+Prime:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--kraft:#DEC59A;--ink:#1C1A17;--soft:#4A3F30;--paper:#FBF7EC;--tomato:#C8371F;--cobalt:#2449C4;--bottle:#1F6B52;--pink:#FF4D94;--yellow:#F2E52E;
  --jazz:#F2E52E;--electronic:#8EC5E6;--rnb:#FF4D94;--rock:#C8371F;--folk:#F08A24;--ambient:#FBF7EC;
  --sans:'Bricolage Grotesque',system-ui,sans-serif;--type:'Courier Prime',ui-monospace,monospace;--marker:'Permanent Marker',cursive}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--kraft);color:var(--ink);font:400 15px/1.4 var(--sans);font-variation-settings:'opsz' 14;height:100vh;overflow:hidden;display:grid;grid-template-rows:64px minmax(0,1fr);-webkit-font-smoothing:antialiased}
body.floor{grid-template-rows:64px minmax(0,1fr) 214px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.soft{color:var(--soft)}

header{display:flex;align-items:center;gap:32px;padding:0 32px}
.mark{font:800 26px/1 var(--sans);font-variation-settings:'wdth' 75,'opsz' 96;letter-spacing:-.01em}
.wk{font-weight:600;color:var(--soft)}
nav{display:flex;gap:6px}
nav button{border:0;background:none;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600}
nav button[aria-current=page]{background:var(--ink);color:var(--paper)}
@media(hover:hover){nav button:not([aria-current]):hover{background:rgba(28,26,23,.1)}}
.right{margin-left:auto;display:flex;gap:18px;align-items:center;font-size:14px;color:var(--soft)}
.right a{color:var(--soft)}
.right b{color:var(--ink);font-weight:600}

main{min-height:0;overflow:auto}

/* Crates */
.floor-in{display:grid;grid-template-columns:repeat(4,300px);gap:32px;justify-content:center;padding:14px 32px 24px}
.crate{outline:none}
.tab{display:inline-block;font:400 19px/1 var(--marker);padding:9px 16px 6px;border-radius:8px 8px 0 0;color:var(--paper)}
.crate.c-new .tab,.crate.c-new .box{background:var(--tomato)}
.crate.c-discover .tab,.crate.c-discover .box{background:var(--cobalt)}
.crate.c-vault .tab,.crate.c-vault .box{background:var(--bottle)}
.crate.c-explore .tab,.crate.c-explore .box{background:var(--ink)}
.box{padding:12px 26px 22px;border-radius:0 6px 6px 6px;position:relative}
.crate:focus-visible .box{outline:3px solid var(--ink);outline-offset:3px}
.pile{position:relative;height:296px;perspective:900px}
.peek{position:absolute;left:0;width:248px;height:40px;overflow:hidden;border:2px solid var(--paper);border-bottom:0}
.peek svg{width:248px;height:248px;display:block}
.front{position:absolute;left:0;top:44px;width:248px;height:248px;transform-origin:50% 100%;transition:transform .16s ease-in,opacity .16s ease-in}
.front .vinyl{position:absolute;top:8px;right:-14px;width:232px;height:232px;border-radius:50%;background:radial-gradient(circle,#3a3632 0 14%,#111 15% 100%)}
.front .sleeve{position:absolute;inset:0;border:2px solid var(--paper);background:var(--paper);box-shadow:0 2px 0 rgba(28,26,23,.25)}
.front .sleeve svg{width:100%;height:100%;display:block}
.front.flip{transform:rotateX(-75deg) translateY(30px);opacity:0}
.front.pull{transition:transform .3s cubic-bezier(.4,0,.6,1),opacity .3s;transform:translateY(240px) rotate(90deg) scale(.25);opacity:0}
.empty-crate{position:absolute;inset:44px 0 0;border:2px dashed rgba(251,247,236,.6);color:var(--paper);display:flex;align-items:center;padding:24px;font-size:17px;font-weight:600}
.why{margin-top:14px;background:var(--paper);padding:12px 14px;font:400 13.5px/1.4 var(--type);min-height:142px}
.why b{display:block;font:700 15px/1.25 var(--sans);font-variation-settings:'wdth' 85}
.why i{display:block;font:400 14px/1.25 var(--sans);font-style:normal;color:var(--soft);margin-bottom:6px}
.left{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--paper);font-size:13px;font-weight:600}
.acts{display:flex;gap:8px}
.b{border:0;white-space:nowrap;height:36px;padding:0 16px;border-radius:999px;font-weight:700;cursor:pointer;font-size:14px}
.b.pull{background:var(--paper);color:var(--ink)}
.b.skip{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 2px rgba(251,247,236,.7)}
@media(hover:hover){.b.pull:hover{background:var(--yellow)}.b.skip:hover{box-shadow:inset 0 0 0 2px var(--paper)}}
.b:active{transform:scale(.96)}

/* Counter */
.counter{background:var(--ink);color:var(--paper);padding:16px 32px 14px;display:grid;grid-template-columns:1120px minmax(0,1fr);gap:8px 28px;align-items:end}
.shelf{position:relative;height:136px;border-bottom:4px solid #6b5a40;display:flex;align-items:flex-end;overflow:hidden}
.mk{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(251,247,236,.45);pointer-events:none;z-index:1}
.mk span{position:absolute;top:0;left:6px;font:400 13px var(--marker);white-space:nowrap;color:var(--yellow)}
.mk.end{border-left-style:solid}
.mk.end span{left:auto;right:6px;color:var(--paper)}
.spine{height:126px;flex:none;border:0;padding:8px 0;display:flex;align-items:center;justify-content:center;gap:4px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;line-height:1.1;cursor:pointer;overflow:hidden;white-space:nowrap;border-left:1.5px solid var(--ink);text-align:left;transform-origin:center}
.spine b,.spine span{display:block;max-height:110px;overflow:hidden;text-overflow:ellipsis}
.spine b{font-weight:700;font-variation-settings:'wdth' 75}
.spine span{opacity:.85}
.spine.dk{color:var(--paper)}
.spine.lt{color:var(--ink)}
.spine.new{animation:slot .3s ease-out}
@keyframes slot{from{max-width:0;opacity:0}to{max-width:200px;opacity:1}}
@media(hover:hover){.spine:hover{filter:brightness(1.08);height:132px}}
.tally{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;align-items:center}
.tally span{display:inline-flex;align-items:center;gap:6px}
.tally i{width:13px;height:13px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px var(--paper)}
.tot{grid-row:1;grid-column:2;align-self:end}
.tot .n{font:800 46px/.95 var(--sans);font-variation-settings:'wdth' 75,'opsz' 96;font-variant-numeric:tabular-nums}
.tot p{margin:6px 0 0;font-size:13.5px}
.tot p.warn{color:var(--yellow);font-weight:600}
.ring{grid-column:2;border:0;background:var(--yellow);color:var(--ink);height:40px;border-radius:999px;font-weight:800;padding:0 18px;cursor:pointer;justify-self:start;font-size:14px;white-space:nowrap}
@media(hover:hover){.ring:hover{background:var(--pink)}}
.ring:active{transform:scale(.97)}
.empty-shelf{align-self:center;font-size:17px;color:rgba(251,247,236,.8)}

/* Receipts */
.rec-v{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:100%}
.railwrap{padding:16px 32px 48px}
.railwrap h1,.gun h1{margin:0;font:800 32px/1 var(--sans);font-variation-settings:'wdth' 75,'opsz' 96}
.filters{display:flex;gap:8px;margin:14px 0 0}
.filters button{border:0;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer;background:rgba(28,26,23,.1)}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.rail{margin-top:22px;border-top:6px solid var(--ink);display:flex;gap:22px;align-items:flex-start;padding:0 8px}
.receipt{width:260px;background:var(--paper);padding:18px 16px 26px;font:400 12.5px/1.5 var(--type);border:0;text-align:left;cursor:pointer;position:relative;margin-top:14px;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/12px 100%}
.receipt::before{content:'';position:absolute;top:-14px;left:50%;width:2px;height:14px;background:var(--ink)}
.receipt[aria-pressed=true]{background:#fff}
.hang{position:relative}
.hang .clip{position:absolute;top:-4px;left:50%;width:22px;height:20px;margin-left:-11px;background:#7a7468;border-radius:3px;z-index:1}
.hang.sel .clip{background:var(--pink)}
.receipt h2{margin:0;font:700 14px/1.3 var(--type);text-align:center}
.receipt .c{text-align:center;margin:0 0 10px}
.rl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;padding:4px 0;border-top:1px dashed #c9bfa8;position:relative}
.rl .t{overflow:hidden}
.rl .t em{font-style:normal;display:block;color:#5A4E3C}
.rl.dim{opacity:.35}
.sticker{position:absolute;right:-6px;top:50%;font:700 10.5px/1 var(--sans);padding:5px 7px;border-radius:999px;transform:translateY(-50%) rotate(-6deg);white-space:nowrap}
.sticker.keeper{background:var(--yellow);color:var(--ink)}
.sticker.more{background:var(--pink);color:var(--ink);transform:translateY(-50%) rotate(5deg)}
.sticker.no{background:var(--ink);color:var(--paper);transform:translateY(-50%) rotate(-4deg)}
.rl .d{padding-right:0}
.rl.has-st .d{visibility:hidden}
.sub{border-top:1px dashed #c9bfa8;margin-top:4px;padding-top:6px}
.sub div{display:flex;justify-content:space-between}
.total{border-top:2px solid var(--ink);margin-top:6px;padding-top:6px;display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.gun{background:var(--paper);padding:20px 28px 48px;border-left:2px solid var(--ink)}
.gun>p{margin:6px 0 16px;color:var(--soft)}
.gl{padding:12px 0;border-top:1.5px solid rgba(28,26,23,.15)}
.gl b{font-weight:700;display:block;font-variation-settings:'wdth' 85}
.gl i{font-style:normal;color:var(--soft);font-size:14px}
.sg{display:flex;gap:6px;margin-top:8px}
.sg button{border:0;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer;background:rgba(28,26,23,.08)}
.sg button.keeper[aria-pressed=true]{background:var(--yellow)}
.sg button.more[aria-pressed=true]{background:var(--pink)}
.sg button.no[aria-pressed=true]{background:var(--ink);color:var(--paper)}
@media(hover:hover){.sg button:hover{background:rgba(28,26,23,.16)}}

/* Stockroom */
.stock{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:100%}
.slist{padding:12px 16px 40px 32px}
.slist h1{margin:4px 0 12px;font:800 28px/1 var(--sans);font-variation-settings:'wdth' 75,'opsz' 96}
.si{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;width:100%;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:left;cursor:pointer}
.si>span:first-child{width:40px;height:40px;display:block;border:2px solid var(--paper)}
.si svg{width:100%;height:100%;display:block}
.si b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si em{display:block;font-style:normal;font-size:13.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si[aria-current=true]{background:var(--ink);color:var(--paper)}
.si[aria-current=true] em{color:rgba(251,247,236,.75)}
@media(hover:hover){.si:not([aria-current=true]):hover{background:rgba(28,26,23,.1)}}
.item{padding:32px 40px 56px}
.unit{position:relative;width:720px;height:400px}
.unit .sl{position:absolute;left:0;top:20px;width:360px;height:360px;border:3px solid var(--paper);z-index:2;transform:rotate(-1deg)}
.unit .sl svg{width:100%;height:100%;display:block}
.card{position:absolute;left:250px;top:44px;width:420px;background:var(--paper);padding:22px 24px 24px 132px;font:400 14px/1.6 var(--type);z-index:1;transform:rotate(1.2deg);box-shadow:0 2px 0 rgba(28,26,23,.2);min-height:320px}
.card h2{margin:0 0 4px;font:700 22px/1.15 var(--sans);font-variation-settings:'wdth' 80}
.card .by{margin:0 0 12px;font-family:var(--sans);font-weight:600}
.card dl{display:grid;grid-template-columns:96px 1fr;margin:0}
.card dt{color:#5A4E3C}
.card dd{margin:0}
.note{margin:14px 0 0;font:400 17px/1.3 var(--marker);color:var(--tomato)}
.tags-h{margin:20px 0 4px;font:800 22px/1 var(--sans);font-variation-settings:'wdth' 75}
.tags-h+p{margin:0;color:var(--soft)}
.tags{display:flex;gap:22px;margin-top:4px;flex-wrap:wrap}
.tag{position:relative;padding-top:44px}
.tag::before{content:'';position:absolute;left:30px;top:0;height:46px;border-left:2px solid var(--ink);transform:rotate(-8deg);transform-origin:top}
.tag-b{position:relative;width:172px;background:var(--paper);padding:20px 14px 14px;border-radius:4px 22px 22px 4px;transform:rotate(-2deg)}
.tag:nth-child(2n) .tag-b{transform:rotate(1.5deg)}
.tag-b::before{content:'';position:absolute;left:24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--kraft);box-shadow:inset 0 0 0 2px var(--ink)}
.tag-b b{display:block;font-weight:800;font-size:15px}
.tag-b span{display:block;font:400 13px var(--type);margin:2px 0 10px}
.tag.out .tag-b{background:transparent;box-shadow:inset 0 0 0 2px rgba(28,26,23,.5)}
.tb{border:0;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;cursor:pointer;background:var(--ink);color:var(--paper)}
.tb.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink);margin-left:4px}
.toast{position:fixed;left:50%;top:76px;transform:translateX(-50%) rotate(-1.5deg);background:var(--yellow);color:var(--ink);padding:12px 18px;font-weight:800;z-index:10;border-radius:4px}
@media (prefers-reduced-motion:reduce){.front,.front.flip,.front.pull{transition:opacity .16s;transform:none}.spine.new{animation:none}}
</style>
</head>
<body class="floor">
<header></header>
<main></main>
<footer></footer>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
{
const { D, byId, hash, secs, cover, fmtHM, fmtDur, esc, genreName, weekRange, shortDate, policy, recordFor } = MIX;
const CRATES = [['new', 'Just in'], ['discover', "Never heard of 'em"], ['vault', 'Back stock'], ['explore', 'Dig deeper']];
const ST = { keeper: 'Keeper', more: 'More of this', no: 'Back in the bin' };
const DARK = new Set(['rock']);
const PX = 140 / 3600;
const S = { view: 'floor', mix: [...D.mix], queues: {}, hist: structuredClone(D.history), pick: 46, filter: null, rec: D.record.albumId, rung: false, busy: false, fresh: null };
CRATES.forEach(([id]) => { S.queues[id] = D.albums.filter(a => a.lane === id && !S.mix.includes(a.id)).map(a => a.id); });
const $ = s => document.querySelector(s);
const total = () => S.mix.reduce((t, id) => t + secs(byId[id]), 0);
const tilt = id => ((hash(id) % 25) / 10 - 1).toFixed(1);

function header() {
  return `<div class="mark">Crate &amp; Counter</div><span class="wk">Week ${D.week.number}, ${weekRange(D.week.starts)}</span>
  <nav>${[['floor', 'The floor'], ['receipts', 'Receipts'], ['stock', 'Stockroom']].map(([v, l]) => `<button data-act="view" data-v="${v}" ${S.view === v ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>
  <div class="right"><span><b>Spotify</b> connected</span><a href="./">All directions</a></div>`;
}

// ---------- The floor ----------
function crate([id, name]) {
  const q = S.queues[id], a = byId[q[0]];
  const peeks = q.slice(1, 6).map((x, i) => `<div class="peek" style="top:${(4 - i) * 8 + 2}px;left:${(i % 2) * 2}px">${cover(byId[x])}</div>`).reverse().join('');
  return `<section class="crate c-${id}" tabindex="0" data-crate="${id}" aria-label="${name} crate, ${q.length} records. Arrow keys flip, Enter pulls."><span class="tab">${name}</span><div class="box">
    <div class="pile">${a ? `${peeks}<div class="front" data-front="${id}" style="transform:rotate(${tilt(a.id)}deg)"><span class="vinyl"></span><span class="sleeve">${cover(a)}</span></div>` : `<div class="empty-crate">You've been through this one. Fresh stock Friday.</div>`}</div>
    ${a ? `<div class="why"><b>${esc(a.artist)}</b><i>${esc(a.title)}, ${a.year}</i>${esc(a.reason)} ${genreName(a.genre)}, ${fmtDur(secs(a))}.</div>` : `<div class="why">Skipped records go to the back of the crate. Pulled ones are on the counter.</div>`}
    <div class="left"><span>${q.length ? `${q.length} left` : 'Empty'}</span><span class="acts">${a ? `<button class="b skip" data-act="skip" data-c="${id}">Skip</button><button class="b pull" data-act="pull" data-c="${id}">Pull it</button>` : ''}</span></div></div></section>`;
}
function counter() {
  const t = total(), items = S.mix.map(id => byId[id]);
  const spines = items.map(a => `<button class="spine ${DARK.has(a.genre) ? 'dk' : 'lt'}${S.fresh === a.id ? ' new' : ''}" data-act="back" data-id="${a.id}" style="width:${secs(a) * PX}px;background:var(--${a.genre})" title="${esc(a.artist)}, ${esc(a.title)}. Click to put it back."><b>${esc(a.artist)}</b><span>${esc(a.title)}</span></button>`).join('');
  const g = D.genres.map(x => ({ ...x, n: items.filter(a => a.genre === x.id).length })).filter(x => x.n);
  const state = t === 0 ? 'Nothing on the counter yet.' : t < 4 * 3600 ? `Light week. ${fmtHM((4 * 3600 - t) / 60)} to go.` : t > 8 * 3600 ? `Bag's full. ${fmtHM((t - 8 * 3600) / 60)} over.` : `Good haul. Room for ${fmtHM((8 * 3600 - t) / 60)} more.`;
  const miss = policy(items).filter(p => !p.ok && p.id !== 'len');
  return `<div class="counter">
    <div class="shelf">${spines || `<span class="empty-shelf">Nothing on the counter. Flip through a crate and pull something.</span>`}<span class="mk" style="left:560px"><span>Enough for a week</span></span><span class="mk end" style="left:1118px"><span>Bag's full</span></span></div>
    <div class="tot"><div class="n">${fmtHM(t / 60).replace(' min', '')}</div><p class="${t > 8 * 3600 ? 'warn' : ''}">${state}</p></div>
    <div class="tally">${g.map(x => `<span><i style="background:var(--${x.id})"></i>${x.name} ${x.n}</span>`).join('')}${miss.map(p => `<span style="color:var(--yellow)">${p.label.replace('No ', 'Watch it: no ')} (${p.value})</span>`).join('')}</div>
    <button class="ring" data-act="ring">${S.rung ? 'Update the Spotify playlist' : 'Ring it up on Spotify'}</button></div>`;
}

// ---------- Receipts ----------
function receipt(w, sel) {
  const t = w.items.reduce((n, a) => n + secs(a), 0);
  const g = {};
  w.items.forEach(a => { g[a.genre] = (g[a.genre] || 0) + secs(a); });
  return `<div class="hang${sel ? ' sel' : ''}"><span class="clip"></span><button class="receipt" data-act="pick" data-w="${w.week}" aria-pressed="${sel}">
    <h2>CRATE &amp; COUNTER</h2><p class="c">Week ${w.week}<br>${weekRange(w.starts)}</p>
    ${w.items.map(a => `<div class="rl${S.filter && a.verdict !== S.filter ? ' dim' : ''}${a.verdict ? ' has-st' : ''}"><span class="t">${esc(a.artist)}<em>${esc(a.title)}</em></span><span class="d">${fmtDur(secs(a))}</span>${a.verdict ? `<span class="sticker ${a.verdict}">${ST[a.verdict]}</span>` : ''}</div>`).join('')}
    <div class="sub">${Object.entries(g).map(([k, v]) => `<div><span>${genreName(k)}</span><span>${fmtDur(v)}</span></div>`).join('')}</div>
    <div class="total"><span>${w.items.length} records</span><span>${fmtDur(t)}</span></div></button></div>`;
}
function receipts() {
  const w = S.hist.find(x => x.week === S.pick);
  return `<div class="rec-v"><div class="railwrap"><h1>Receipts</h1>
    <div class="filters"><button data-act="filter" data-k="" aria-pressed="${!S.filter}">All</button>${Object.entries(ST).map(([k, l]) => `<button data-act="filter" data-k="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join('')}</div>
    <div class="rail">${S.hist.map(x => receipt(x, x.week === S.pick)).join('')}</div></div>
    <aside class="gun"><h1>Week ${w.week}</h1><p>Sticker each record. Keepers come back as back stock, More of this fills Dig deeper.</p>
      ${w.items.map((a, i) => `<div class="gl"><b>${esc(a.artist)}</b><i>${esc(a.title)}</i><div class="sg">${Object.entries(ST).map(([k, l]) => `<button class="${k}" data-act="stick" data-i="${i}" data-k="${k}" data-focus="sg-${i}-${k}" aria-pressed="${a.verdict === k}">${l}</button>`).join('')}</div></div>`).join('')}</aside></div>`;
}

// ---------- Stockroom ----------
function stock() {
  const a = byId[S.rec], r = recordFor(a);
  const weeks = [...S.hist.filter(w => w.items.some(x => x.title === a.title)).map(w => w.week), ...(S.mix.includes(a.id) ? [D.week.number] : [])];
  return `<div class="stock"><div class="slist"><h1>Stockroom</h1>${D.albums.map(x => `<button class="si" data-act="rec" data-id="${x.id}" data-focus="si-${x.id}" aria-current="${x.id === S.rec}"><span>${cover(x)}</span><span><b>${esc(x.artist)}</b><em>${esc(x.title)}</em></span></button>`).join('')}</div>
  <div class="item"><div class="unit"><span class="sl">${cover(a)}</span><div class="card"><h2>${esc(a.title)}</h2><p class="by">${r.artists.map(esc).join(', ')}</p>
    <dl><dt>Stock no.</dt><dd>${r.catalogId}</dd><dt>Released</dt><dd>${r.released}</dd>${r.label ? `<dt>Label</dt><dd>${esc(r.label)}</dd>` : ''}<dt>Length</dt><dd>${fmtDur(secs(a))}, ${r.tracks} tracks</dd><dt>Section</dt><dd>${genreName(a.genre)}</dd><dt>Bought</dt><dd>${weeks.length ? weeks.map(w => `week ${w}`).join(', ') : 'Not yet'}</dd></dl>
    ${r.notes ? `<p class="note">${esc(r.notes)}</p>` : ''}</div></div>
    <h2 class="tags-h">Where it's stocked</h2><p>The record is yours. Services are shops that carry it.</p>
    <div class="tags">${r.services.map((s, i) => `<div class="tag${s.status === 'linked' ? '' : ' out'}"><div class="tag-b"><b>${s.name}</b><span>${s.status === 'linked' ? 'In stock' : s.status === 'search' ? 'Checking the shelves' : 'Not stocked'}</span>
      ${s.status === 'linked' ? `<button class="tb" data-act="noop">Open</button><button class="tb ghost" data-act="unlink" data-i="${i}" data-focus="t-${i}">Remove</button>` : `<button class="tb" data-act="link" data-i="${i}" data-focus="t-${i}" ${s.status === 'search' ? 'disabled' : ''}>Look it up</button>`}</div></div>`).join('')}</div></div></div>`;
}

function render() {
  const fk = document.activeElement?.dataset?.focus || (document.activeElement?.dataset?.crate && 'crate-' + document.activeElement.dataset.crate);
  document.body.className = S.view === 'floor' ? 'floor' : '';
  $('header').innerHTML = header();
  $('main').innerHTML = S.view === 'floor' ? `<div class="floor-in">${CRATES.map(crate).join('')}</div>` : S.view === 'receipts' ? receipts() : stock();
  $('footer').innerHTML = S.view === 'floor' ? counter() : '';
  $('footer').hidden = S.view !== 'floor';
  S.fresh = null;
  if (fk?.startsWith('crate-')) document.querySelector(`[data-crate="${fk.slice(6)}"]`)?.focus({ preventScroll: true });
  else if (fk) document.querySelector(`[data-focus="${fk}"]`)?.focus({ preventScroll: true });
}
function toast(msg) { document.querySelector('.toast')?.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 4200); }
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function animate(c, cls, ms, then) {
  if (S.busy) return;
  const f = document.querySelector(`[data-front="${c}"]`);
  if (!f) return;
  S.busy = true;
  f.style.transform = ''; void f.offsetWidth; f.classList.add(cls);
  setTimeout(() => { S.busy = false; then(); render(); }, reduce ? 160 : ms);
}
const skip = c => animate(c, 'flip', 170, () => { const q = S.queues[c]; q.push(q.shift()); });
const pull = c => animate(c, 'pull', 300, () => { const id = S.queues[c].shift(); S.mix.push(id); S.fresh = id; S.rung = false; });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const { act, id } = el.dataset;
  if (act === 'view') { S.view = el.dataset.v; render(); }
  else if (act === 'skip') skip(el.dataset.c);
  else if (act === 'pull') pull(el.dataset.c);
  else if (act === 'back') { S.mix = S.mix.filter(x => x !== id); S.queues[byId[id].lane].unshift(id); S.rung = false; render(); }
  else if (act === 'ring') {
    if (!S.mix.length) return toast('Nothing to ring up. Pull a record first.');
    S.rung = true; render(); toast(`Rung up. Week ${D.week.number} is in your Spotify, receipt's on the rail.`);
  }
  else if (act === 'pick') { S.pick = +el.dataset.w; render(); }
  else if (act === 'filter') { S.filter = el.dataset.k || null; render(); }
  else if (act === 'stick') { const it = S.hist.find(w => w.week === S.pick).items[+el.dataset.i]; it.verdict = it.verdict === el.dataset.k ? null : el.dataset.k; render(); }
  else if (act === 'rec') { S.rec = id; render(); }
  else if (act === 'link') { const s = recordFor(byId[S.rec]).services[+el.dataset.i]; s.status = 'search'; render(); setTimeout(() => { s.status = 'linked'; render(); }, 900); }
  else if (act === 'unlink') { recordFor(byId[S.rec]).services[+el.dataset.i].status = 'unlinked'; render(); }
});
document.addEventListener('keydown', e => {
  const c = e.target.dataset?.crate; if (!c) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); skip(c); }
  else if (e.key === 'Enter') { e.preventDefault(); pull(c); }
});
let wheelAt = 0;
document.addEventListener('wheel', e => {
  const cr = e.target.closest('.pile'); if (!cr) return;
  e.preventDefault();
  if (Date.now() - wheelAt > 350 && Math.abs(e.deltaY) > 4) { wheelAt = Date.now(); skip(cr.closest('[data-crate]').dataset.crate); }
}, { passive: false });

render();
}
</script>
</body>
</html>
